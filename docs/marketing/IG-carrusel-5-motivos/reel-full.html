<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Regular.ttf');font-weight:400;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-SemiBold.ttf');font-weight:600;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Bold.ttf');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
html,body{width:1080px;height:1920px;overflow:hidden;}
#stage{width:1080px;height:1920px;background:#0E0E0E;display:flex;align-items:center;justify-content:center;transition:background .14s linear;}
#card{max-width:920px;padding:0 64px;text-align:center;}

/* frase hero (karaoke palabra x palabra) */
.sentence{font-weight:700;font-size:66px;color:#fff;line-height:1.24;letter-spacing:-1.2px;transition:opacity .3s ease,transform .3s ease;}
.sentence .w{display:inline-block;opacity:.14;transform:translateY(14px);transition:opacity .34s ease,transform .34s ease;}
.sentence .w.on{opacity:1;transform:none;}
.sentence.out{opacity:0;transform:translateY(-18px) scale(.98);}

/* listas (viñetas / numeradas) que se van sumando */
.glist{display:flex;flex-direction:column;gap:40px;text-align:left;transition:opacity .32s ease,transform .32s ease;}
.glist.out{opacity:0;transform:translateY(-16px);}
.item{display:flex;align-items:flex-start;gap:26px;opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease;}
.item.on{opacity:1;transform:none;}
.dot{flex-shrink:0;width:17px;height:17px;border-radius:50%;background:#D85A30;margin-top:26px;}
.dot.white{background:#fff;}
.num{flex-shrink:0;width:58px;height:58px;border-radius:50%;background:#fff;color:#378ADD;font-weight:700;font-size:32px;display:flex;align-items:center;justify-content:center;margin-top:4px;}
.itx{font-size:58px;font-weight:600;color:#fff;line-height:1.28;letter-spacing:-.7px;}

/* tesis final — invertimos la ecuación */
.tesis{transition:opacity .32s ease,transform .32s ease;}
.tesis.out{opacity:0;transform:translateY(-16px);}
.t1{display:block;font-weight:700;font-size:62px;color:#fff;letter-spacing:-1.6px;line-height:1.1;opacity:0;transform:translateY(16px);transition:opacity .4s ease,transform .4s ease;}
.t1.on{opacity:1;transform:none;}
.t2{display:block;margin-top:30px;font-weight:700;font-size:92px;color:#fff;letter-spacing:-3px;line-height:1.05;opacity:0;transform:scale(.86);transition:opacity .3s ease,transform .46s cubic-bezier(.18,.85,.25,1);}
.t2.on{opacity:1;transform:scale(1);}

/* pivote */
.pivot{font-weight:700;font-size:124px;color:#fff;letter-spacing:-4px;line-height:1.02;opacity:0;transform:scale(.86);
  transition:opacity .3s ease,transform .46s cubic-bezier(.18,.85,.25,1);}
.pivot.on{opacity:1;transform:scale(1);}
.pivot.out{opacity:0;transition:opacity .3s ease;}

/* hook — TE INTERESA en azul Docto */
#hk{transition:opacity .3s ease,transform .3s ease;}
#hk.out{opacity:0;transform:translateY(-16px);}
.hk-eb{display:block;font-size:60px;font-weight:600;color:#fff;letter-spacing:-1px;margin-bottom:22px;opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .35s ease;}
.hk-eb.on{opacity:1;transform:none;}
.hk-big{display:block;font-size:120px;font-weight:700;color:#378ADD;letter-spacing:-4px;line-height:1;opacity:0;transform:scale(.85);transition:opacity .3s ease,transform .46s cubic-bezier(.18,.85,.25,1);}
.hk-big.on{opacity:1;transform:scale(1);}

/* cierre Docto */
.iso{display:block;margin:0 auto 26px;}
.dw{opacity:0;transform:translateY(26px);transition:opacity .5s ease,transform .5s ease;}
.dw.on{opacity:1;transform:none;}
.docto{display:block;font-weight:700;font-size:124px;color:#fff;letter-spacing:-4px;line-height:1;}
.sub{display:block;margin-top:26px;font-size:42px;font-weight:600;color:#fff;letter-spacing:-.5px;opacity:.96;}
.url{display:block;margin-top:20px;font-size:34px;font-weight:700;color:#fff;opacity:.9;}
</style></head>
<body>
<div id="stage"><div id="card"></div></div>
<script>
const stage=document.getElementById('stage'), card=document.getElementById('card');
const CAD=245;
const ISO='<svg class="iso" viewBox="0 0 40 40" width="80" height="80" fill="none"><path d="M13 8 L13 18 Q13 25 20 25 Q27 25 27 18 L27 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/><line x1="20" y1="25" x2="20" y2="30" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="13" cy="7" r="2.8" fill="#fff"/><circle cx="27" cy="7" r="2.8" fill="#fff"/><circle cx="20" cy="33.2" r="3.4" fill="#fff"/></svg>';

const GRUPOS=[
 ["Si estudiaste seis años como si no hubiera un mañana.",
  "Si te recibiste y entraste a una residencia a trabajar como si no hubiera un mañana."],
 ["Si hacés consultorio sin dormir.",
  "Si te llenan la agenda con más pacientes que turnos."],
 ["Si del valor de una consulta, a vos te toca una pequeña parte.",
  "Si vas de acá para allá entre guardias, consultorios y sanatorios."],
 ["Si montar tu consultorio es caro.",
  "Si los pacientes luchan por un turno en un sanatorio.",
  "Si atendés hoy y cobrás en 15 días…"],
];
const PASOS=["Te ponés disponible","Los pacientes te eligen","Recibís tus honorarios en el momento","Atendés de manera virtual"];

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reflow=el=>void el.offsetWidth;
async function karaoke(str){
  card.innerHTML='<div class="sentence" id="snt">'+str.split(' ').map(w=>'<span class="w">'+w+'</span>').join(' ')+'</div>';
  for(const w of card.querySelectorAll('.w')){ w.classList.add('on'); await sleep(CAD); }
}
async function punch(html, cls){
  card.innerHTML='<div class="'+cls+'" id="pz">'+html+'</div>';
  const el=document.getElementById('pz'); reflow(el); el.classList.add('on');
}
async function out(){ const el=card.firstElementChild; if(el){ el.classList.add('out'); await sleep(300);} }
async function lista(items, kind){
  const rows=items.map((l,i)=>{
    const mark = kind==='num' ? '<span class="num">'+(i+1)+'</span>'
               : kind==='white' ? '<span class="dot white"></span>'
               : '<span class="dot"></span>';
    return '<div class="item">'+mark+'<span class="itx">'+l+'</span></div>';
  }).join('');
  card.innerHTML='<div class="glist" id="gl">'+rows+'</div>';
  for(const b of card.querySelectorAll('.item')){ b.classList.add('on'); await sleep(1550); }
  await sleep(3950);   // +3s: la lista completa queda en pantalla para poder leerla
  document.getElementById('gl').classList.add('out'); await sleep(320);
}
async function hookIntro(){
  card.innerHTML='<div id="hk"><span class="hk-eb">Si sos médica/o</span><span class="hk-big">TE INTERESA!</span></div>';
  reflow(card.querySelector('.hk-eb')); card.querySelector('.hk-eb').classList.add('on');
  await sleep(320); reflow(card.querySelector('.hk-big')); card.querySelector('.hk-big').classList.add('on');
  await sleep(1900); document.getElementById('hk').classList.add('out'); await sleep(300);
}

async function tesis(){
  card.innerHTML='<div class="tesis" id="tz"><span class="t1">Invertimos la ecuación!</span><span class="t2">Docto trabaja<br>para vos!</span></div>';
  const t1=card.querySelector('.t1'), t2=card.querySelector('.t2');
  reflow(t1); t1.classList.add('on');
  await sleep(1500);
  reflow(t2); t2.classList.add('on');
  await sleep(2800);
  document.getElementById('tz').classList.add('out'); await sleep(320);
}
async function run(){
  await document.fonts.ready; await sleep(400);
  await hookIntro();
  await karaoke("Sabemos cuánto amás tu profesión."); await sleep(950); await out();
  for(const g of GRUPOS){ await lista(g, 'orange'); }
  await punch("Algo, no funciona.","pivot"); await sleep(1700); await out();
  // ---- se prende la luz: Docto (azul) ----
  stage.style.background='#378ADD'; await sleep(320);
  await karaoke("Docto conecta pacientes con médicos. Sin más."); await sleep(750); await out();
  await lista(PASOS, 'num');
  await tesis();
  card.innerHTML='<div class="dw" id="dw">'+ISO+'<span class="docto">Docto</span><span class="sub">Tu agenda, tus honorarios, tus pacientes.</span><span class="url">docto.com.ar</span></div>';
  reflow(document.getElementById('dw')); document.getElementById('dw').classList.add('on');
  await sleep(3400);
  window.__DONE=true;
}
run();
</script>
</body></html>
