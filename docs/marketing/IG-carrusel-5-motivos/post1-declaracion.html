<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Regular.ttf');font-weight:400;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Medium.ttf');font-weight:500;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-SemiBold.ttf');font-weight:600;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Bold.ttf');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
body{background:#555;}
.slide{width:1080px;height:1350px;background:#fff;padding:100px 92px 92px;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;gap:15px;}
.brand .wm{font-size:40px;font-weight:700;color:#111827;letter-spacing:-1.1px;}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;}
.stmt{font-size:54px;font-weight:700;color:#111827;line-height:1.17;letter-spacing:-1.8px;}
.punch{font-size:60px;font-weight:700;color:#378ADD;line-height:1.08;letter-spacing:-2px;margin-top:40px;}
.foot{font-size:30px;font-weight:700;color:#378ADD;}
</style></head>
<body>
<div class="slide">
  <div class="brand">
    <svg viewBox="0 0 40 40" width="54" height="54" fill="none">
      <path d="M13 8 L13 18 Q13 25 20 25 Q27 25 27 18 L27 8" stroke="#378ADD" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="20" y1="25" x2="20" y2="30" stroke="#378ADD" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="13" cy="7" r="2.8" fill="#378ADD"/>
      <circle cx="27" cy="7" r="2.8" fill="#378ADD"/>
      <circle cx="20" cy="33.2" r="3.4" fill="#378ADD"/>
    </svg>
    <span class="wm">Docto</span>
  </div>

  <div class="main">
    <div class="stmt">Para atenderte con un médico no debería hacer falta una cartilla, un call center y tres semanas de espera.</div>
    <div class="punch">Por eso hicimos Docto.</div>
  </div>

  <div class="foot">docto.com.ar</div>
</div>
</body></html>
