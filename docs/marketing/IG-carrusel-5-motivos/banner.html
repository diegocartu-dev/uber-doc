<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Regular.ttf');font-weight:400;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Medium.ttf');font-weight:500;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-SemiBold.ttf');font-weight:600;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Bold.ttf');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
body{background:#555;}
.banner{width:1500px;height:500px;background:#EBF3FC;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 120px;}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:30px;}
.brand .wm{font-size:42px;font-weight:700;color:#0C447C;letter-spacing:-1.2px;}
.hook{font-size:62px;font-weight:700;color:#111827;letter-spacing:-1.8px;line-height:1.08;}
.hook .b{color:#378ADD;}
.trust{margin-top:30px;font-size:24px;font-weight:500;color:#3E78B5;letter-spacing:0.2px;}
</style></head>
<body>
<div class="banner">
  <div class="brand">
    <svg viewBox="0 0 40 40" width="58" height="58" fill="none">
      <path d="M13 8 L13 18 Q13 25 20 25 Q27 25 27 18 L27 8" stroke="#378ADD" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="20" y1="25" x2="20" y2="30" stroke="#378ADD" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="13" cy="7" r="2.8" fill="#378ADD"/>
      <circle cx="27" cy="7" r="2.8" fill="#378ADD"/>
      <circle cx="20" cy="33.2" r="3.4" fill="#378ADD"/>
    </svg>
    <span class="wm">Docto</span>
  </div>
  <div class="hook">El médico que necesitás, <span class="b">cuando lo necesitás.</span></div>
  <div class="trust">Médicos con matrícula verificada · Atención directa, sin intermediarios</div>
</div>
</body></html>
