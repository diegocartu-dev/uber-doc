<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Regular.ttf');font-weight:400;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-SemiBold.ttf');font-weight:600;}
@font-face{font-family:'Inter';src:url('../../../src/fonts/Inter-Bold.ttf');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
html,body{width:1080px;height:1920px;overflow:hidden;}
#stage{width:1080px;height:1920px;background:#0E0E0E;display:flex;align-items:center;justify-content:center;transition:background .1s linear;}
#card{max-width:940px;padding:0 70px;text-align:center;}

/* frase karaoke */
.sentence{font-weight:700;font-size:64px;color:#fff;line-height:1.24;letter-spacing:-1.2px;transition:opacity .3s ease,transform .3s ease;}
.sentence .w{display:inline-block;opacity:.14;transform:translateY(14px);transition:opacity .34s ease,transform .34s ease;}
.sentence .w.on{opacity:1;transform:none;}
.sentence.out{opacity:0;transform:translateY(-18px) scale(.98);}

/* máxima (la imagen que el médico siente propia) */
.maxima{font-weight:700;font-size:104px;color:#D85A30;letter-spacing:-3.5px;line-height:1.03;opacity:0;transform:scale(.86);
  transition:opacity .3s ease,transform .44s cubic-bezier(.18,.85,.25,1);}
.maxima.on{opacity:1;transform:scale(1);}
.maxima.out{opacity:0;transform:scale(1.04);transition:opacity .28s ease;}
.para{font-weight:700;font-size:180px;color:#fff;letter-spacing:-6px;opacity:0;transform:scale(.86);
  transition:opacity .3s ease,transform .44s cubic-bezier(.18,.85,.25,1);}
.para.on{opacity:1;transform:scale(1);}
.para.out{opacity:0;transition:opacity .3s ease;}

/* hook de apertura */
#hk{transition:opacity .3s ease,transform .3s ease;}
#hk.out{opacity:0;transform:translateY(-16px);}
.hk-eb{display:block;font-size:58px;font-weight:600;color:#fff;letter-spacing:-1px;margin-bottom:22px;opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .35s ease;}
.hk-eb.on{opacity:1;transform:none;}
.hk-big{display:block;font-size:120px;font-weight:700;color:#D85A30;letter-spacing:-4px;line-height:1;opacity:0;transform:scale(.85);transition:opacity .3s ease,transform .44s cubic-bezier(.18,.85,.25,1);}
.hk-big.on{opacity:1;transform:scale(1);}

/* cierre Docto */
.iso{display:block;margin:0 auto 26px;}
.dw{opacity:0;transform:translateY(26px);transition:opacity .5s ease,transform .5s ease;}
.dw.on{opacity:1;transform:none;}
.docto{display:block;font-weight:700;font-size:124px;color:#fff;letter-spacing:-4px;line-height:1;}
.sub{display:block;margin-top:26px;font-size:40px;font-weight:600;color:#fff;letter-spacing:-.5px;opacity:.96;}
.url{display:block;margin-top:20px;font-size:33px;font-weight:700;color:#fff;opacity:.9;}
</style></head>
<body>
<div id="stage"><div id="card"></div></div>
<script>
const stage=document.getElementById('stage'), card=document.getElementById('card');
const ISO='<svg class="iso" viewBox="0 0 40 40" width="80" height="80" fill="none"><path d="M13 8 L13 18 Q13 25 20 25 Q27 25 27 18 L27 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/><line x1="20" y1="25" x2="20" y2="30" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="13" cy="7" r="2.8" fill="#fff"/><circle cx="27" cy="7" r="2.8" fill="#fff"/><circle cx="20" cy="33.2" r="3.4" fill="#fff"/></svg>';

// cada beat: la frase (karaoke) + su máxima (golpe)
const BEATS=[
 {words:["Si","estudiaste","seis","años","como","si","no","hubiera","un","mañana."], maxima:"Seis años."},
 {words:["Si","atendés","a","miles","de","pacientes","sin","dormir."], maxima:"Sin dormir."},
 {words:["Si","hacés","40","kilómetros","por","día","entre","guardias","y","sanatorios."], maxima:"40 km por día."},
 {words:["Si","atendés","hoy","y","cobrás","en","15,","20,","25","días."], maxima:"Cobrás en 25 días."},
];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reflow=el=>void el.offsetWidth;

async function karaoke(words){
  card.innerHTML='<div class="sentence" id="snt">'+words.map(w=>'<span class="w">'+w+'</span>').join(' ')+'</div>';
  for(const w of card.querySelectorAll('.w')){ w.classList.add('on'); await sleep(300); }
}
async function punch(html, cls){
  card.innerHTML='<div class="'+cls+'" id="pz">'+html+'</div>';
  const el=document.getElementById('pz'); reflow(el); el.classList.add('on');
}
async function out(){ const el=card.firstElementChild; if(el){ el.classList.add('out'); await sleep(300);} }

async function hookIntro(){
  card.innerHTML='<div id="hk"><span class="hk-eb">Si sos médico</span><span class="hk-big">TE INTERESA!</span></div>';
  const eb=card.querySelector('.hk-eb'), big=card.querySelector('.hk-big');
  reflow(eb); eb.classList.add('on');
  await sleep(300); reflow(big); big.classList.add('on');
  await sleep(1900);
  document.getElementById('hk').classList.add('out'); await sleep(300);
}
async function run(){
  await document.fonts.ready; await sleep(400);
  await hookIntro();
  for(const b of BEATS){
    await karaoke(b.words);
    await sleep(650);          // lee la frase completa
    await out();
    await punch(b.maxima,'maxima');
    await sleep(1500);         // la máxima queda
    await out();
  }
  await punch('Pará.','para'); await sleep(1900); await out();
  stage.style.background='#378ADD';
  card.innerHTML='<div class="dw" id="dw">'+ISO+'<span class="docto">Docto</span><span class="sub">Tu agenda. Tus honorarios. Tus pacientes.</span><span class="url">docto.com.ar</span></div>';
  const dw=document.getElementById('dw'); reflow(dw); dw.classList.add('on');
  await sleep(3200);
}
run();
</script>
</body></html>
