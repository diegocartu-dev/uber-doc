name: Quality Gate — Playwright

on:
  pull_request:
    branches: [main]
  schedule:
    # 3AM Argentina (UTC-3) = 6AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://uber-doc.vercel.app' }}

jobs:
  test:
    name: Etapa 1 — Tests críticos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - name: Resolve Vercel Preview URL for PRs
        if: github.event_name == 'pull_request'
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          for i in $(seq 1 60); do
            DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&environment=Preview" \
              --jq '.[0].id // empty' 2>/dev/null)
            if [ -n "$DEPLOY_ID" ]; then
              ENV_URL=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '[.[] | select(.state=="success")] | .[0].environment_url // empty' 2>/dev/null)
              if [ -n "$ENV_URL" ]; then
                echo "url=$ENV_URL" >> "$GITHUB_OUTPUT"
                echo "✅ Preview URL: $ENV_URL"
                exit 0
              fi
            fi
            echo "⏳ Waiting for Vercel preview ($i/60)..."
            sleep 5
          done
          echo "⚠️ Preview not found, falling back to production"

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url || env.PLAYWRIGHT_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  alert:
    name: Alerta por email si hay failures
    runs-on: ubuntu-latest
    needs: test
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: test-results/

      - name: Send alert (only if failures)
        run: node scripts/send-test-report.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: diegocartu@gmail.com
