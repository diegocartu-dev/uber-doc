name: Quality Gate — Playwright

on:
  pull_request:
    branches: [main]
  schedule:
    # 3AM Argentina (UTC-3) = 6AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      # Plan B para el gate de un PR cuando Vercel arma la vista previa pero no
      # se lo avisa a GitHub (12/10/2026: incidente en su integración con Git;
      # el gate esperaba un aviso que no llegaba y el merge quedaba trabado).
      # Se lanza sobre la rama del PR con la URL de SU vista previa:
      #   gh workflow run playwright.yml --ref <rama> -f preview_url=https://….vercel.app
      # El check queda sobre el último commit de la rama, con el mismo nombre que
      # pide la protección de main. Antes de correr nada, el paso "Verificar que
      # la vista previa es de este commit" exige que /api/health de esa URL
      # responda el mismo SHA: no se puede aprobar un PR probando otro código.
      preview_url:
        description: "Vista previa del PR (https://…vercel.app). Vacío = corrida contra producción"
        required: false
        default: ""

permissions:
  deployments: read
  contents: read

env:
  PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://uber-doc.vercel.app' }}

jobs:
  test:
    name: Etapa 1 — Tests críticos
    runs-on: ubuntu-latest
    # 45 y no 20: la espera de la vista previa puede llevar hasta 30 (abajo).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # La versión sale de `.nvmrc` y no de acá: es la misma que tiene que usar
      # quien re-selle las huellas del golden del PDF a mano
      # (scripts/pdf-golden-huellas.mts). Con el número escrito en dos lugares,
      # el día que uno se mueva el otro no se entera.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tests unitarios ANTES de todo: corren en segundos, no necesitan preview,
      # y son los que fijan la regla de oro del modo institucional. Hasta ahora
      # no los ejecutaba nadie —`npm test` es playwright y su testDir es
      # tests/e2e—, así que un gate escrito al revés mergeaba en verde.
      - name: Tests unitarios
        run: npm run test:unit

      - run: npx playwright install chromium

      - name: Wait for Vercel preview deployment
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          echo "Waiting for Vercel preview for commit $PR_SHA..."

          # Hasta 30 minutos (180 × 10 s). Normalmente Vercel registra la vista
          # previa en GitHub en 1-1,5 min, pero el 12/10/2026, con incidentes
          # abiertos en Vercel (integración con Git) y en GitHub (Actions), tardó
          # ~30 min y con 5 min de espera el gate fallaba sin haber corrido un
          # solo test. Esperar más no abre nada: sin vista previa, sigue fallando.
          for i in $(seq 1 180); do
            # El repo tiene DOS proyectos Vercel conectados (el marketplace y la
            # instancia institucional), así que Vercel desambigua los entornos:
            # ya no existe "Preview" a secas, sino "Preview - uber-doc" y
            # "Preview - instancia-institucional". Buscamos el del marketplace,
            # que es contra el que corren estos tests; el de la instancia se
            # cancela por Ignored Build Step y nunca tiene environment_url.
            DEPLOY_ID=$(gh api "repos/$GH_REPO/deployments?sha=$PR_SHA" \
              --jq '[.[] | select(.environment | startswith("Preview")) | select(.environment | test("instancia") | not)] | .[0].id // empty' 2>/dev/null)

            if [ -n "$DEPLOY_ID" ]; then
              STATUS=$(gh api "repos/$GH_REPO/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].state // empty' 2>/dev/null)
              URL=$(gh api "repos/$GH_REPO/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].environment_url // empty' 2>/dev/null)

              if [ "$STATUS" = "success" ] && [ -n "$URL" ]; then
                echo "url=$URL" >> "$GITHUB_OUTPUT"
                echo "Preview ready: $URL"
                exit 0
              fi
              echo "Deploy found (id=$DEPLOY_ID), status=$STATUS — waiting... ($i/180)"
            else
              echo "No deployment found yet — waiting... ($i/180)"
            fi

            sleep 10
          done

          echo "::error::Timeout waiting for Vercel preview deployment (30 min)"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}

      - name: Verificar que la vista previa es de este commit
        if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
        run: |
          if [[ ! "$DISPATCH_URL" =~ ^https://[a-z0-9-]+\.vercel\.app/?$ ]]; then
            echo "::error::preview_url no es una URL de Vercel: $DISPATCH_URL"
            exit 1
          fi
          SHA_VISTA=$(curl -fsS -H "x-vercel-protection-bypass: $BYPASS" "${DISPATCH_URL%/}/api/health" | jq -r '.sha // empty')
          if [ "$SHA_VISTA" != "$GITHUB_SHA" ]; then
            echo "::error::La vista previa sirve el commit '$SHA_VISTA' y esta corrida es de '$GITHUB_SHA'"
            exit 1
          fi
          echo "Vista previa verificada: sirve $GITHUB_SHA"
        env:
          DISPATCH_URL: ${{ inputs.preview_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Set test URL
        id: test-url
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_URL" ]; then
            echo "base_url=${DISPATCH_URL%/}" >> "$GITHUB_OUTPUT"
            echo "Testing against preview (lanzado a mano): $DISPATCH_URL"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PREVIEW_URL" ]; then
            if [[ ! "$PREVIEW_URL" =~ ^https://.*\.vercel\.app/?$ ]]; then
              echo "::error::Preview URL does not match expected Vercel domain: $PREVIEW_URL"
              exit 1
            fi
            echo "base_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            echo "Testing against preview: $PREVIEW_URL"
          else
            echo "base_url=$FALLBACK_URL" >> "$GITHUB_OUTPUT"
            echo "Testing against production: $FALLBACK_URL"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          DISPATCH_URL: ${{ inputs.preview_url }}
          FALLBACK_URL: ${{ env.PLAYWRIGHT_BASE_URL }}

      - name: Reset cuentas de prueba
        run: node scripts/sereno-reset.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.test-url.outputs.base_url }}
          # Bypass de Vercel Deployment Protection: deja al CI entrar al preview
          # protegido (era lo que le faltaba a #65 → daba 401 → se revirtió).
          # La cabecera se manda solo si hay secret (ver playwright.config.ts).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Cleanup datos de prueba
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.preview_url == ''))
        run: node scripts/sereno-cleanup.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Reportar resultado a /admin/sereno
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.preview_url == ''))
        run: node scripts/sereno-report.mjs
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          SERENO_API_TOKEN: ${{ secrets.SERENO_API_TOKEN }}
