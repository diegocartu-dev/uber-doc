name: Quality Gate — Playwright

on:
  pull_request:
    branches: [main]
  schedule:
    # 3AM Argentina (UTC-3) = 6AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://uber-doc.vercel.app' }}

jobs:
  test:
    name: Etapa 1 — Tests críticos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - name: Wait for Vercel preview deployment
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "Waiting for Vercel preview for commit $SHA..."

          for i in $(seq 1 30); do
            DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&environment=Preview" \
              --jq '.[0].id // empty' 2>/dev/null)

            if [ -n "$DEPLOY_ID" ]; then
              STATUS=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].state // empty' 2>/dev/null)
              URL=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].environment_url // empty' 2>/dev/null)

              if [ "$STATUS" = "success" ] && [ -n "$URL" ]; then
                echo "url=$URL" >> "$GITHUB_OUTPUT"
                echo "Preview ready: $URL"
                exit 0
              fi
              echo "Deploy found (id=$DEPLOY_ID), status=$STATUS — waiting... ($i/30)"
            else
              echo "No deployment found yet — waiting... ($i/30)"
            fi

            sleep 10
          done

          echo "::error::Timeout waiting for Vercel preview deployment (5 min)"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set test URL
        id: test-url
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ steps.preview.outputs.url }}" ]; then
            echo "base_url=${{ steps.preview.outputs.url }}" >> "$GITHUB_OUTPUT"
            echo "Testing against preview: ${{ steps.preview.outputs.url }}"
          else
            echo "base_url=${{ env.PLAYWRIGHT_BASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "Testing against production: ${{ env.PLAYWRIGHT_BASE_URL }}"
          fi

      - name: Reset cuentas de prueba
        run: node scripts/sereno-reset.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.test-url.outputs.base_url }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Cleanup datos de prueba
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/sereno-cleanup.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Reportar resultado a /admin/sereno
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/sereno-report.mjs
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          SERENO_API_TOKEN: ${{ secrets.SERENO_API_TOKEN }}
