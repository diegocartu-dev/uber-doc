name: Quality Gate — Playwright

on:
  pull_request:
    branches: [main]
  schedule:
    # 3AM Argentina (UTC-3) = 6AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  deployments: read
  contents: read
  # Para leer el comentario "vista-previa:" del plan B (ver el paso de espera).
  pull-requests: read
  issues: read

env:
  PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://uber-doc.vercel.app' }}

jobs:
  test:
    name: Etapa 1 — Tests críticos
    runs-on: ubuntu-latest
    # 45 y no 20: la espera de la vista previa puede llevar hasta 30 (abajo).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # La versión sale de `.nvmrc` y no de acá: es la misma que tiene que usar
      # quien re-selle las huellas del golden del PDF a mano
      # (scripts/pdf-golden-huellas.mts). Con el número escrito en dos lugares,
      # el día que uno se mueva el otro no se entera.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tests unitarios ANTES de todo: corren en segundos, no necesitan preview,
      # y son los que fijan la regla de oro del modo institucional. Hasta ahora
      # no los ejecutaba nadie —`npm test` es playwright y su testDir es
      # tests/e2e—, así que un gate escrito al revés mergeaba en verde.
      - name: Tests unitarios
        run: npm run test:unit

      - run: npx playwright install chromium

      - name: Wait for Vercel preview deployment
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          echo "Waiting for Vercel preview for commit $PR_SHA..."

          # La vista previa se busca por TRES caminos en cada vuelta, y gana el
          # primero que la encuentra:
          #
          # 1. VERCEL DIRECTO (el principal desde el 12/10/2026). Se le pregunta a
          #    la API de Vercel por el deploy de este commit. No depende de que
          #    Vercel le avise a GitHub: ese aviso es el que se trabó el 12/10
          #    (incidente en su integración con Git) — la vista previa estaba en
          #    un minuto y los avisos llegaban casi una hora después, o nunca, y
          #    cada PR se comía 30 minutos de espera y fallaba sin correr un test.
          #    Usa el secreto VERCEL_TOKEN. Si Vercel lo rechaza (venció o lo
          #    revocaron) se avisa con un warning visible y siguen los otros dos:
          #    nunca queda trabado sin que nadie sepa por qué.
          #    Si Vercel dice que el build FALLÓ, se corta acá: no hay vista previa
          #    que esperar.
          # 2. El aviso de Vercel a GitHub (deployments API). El de siempre.
          # 3. Un comentario en el PR, de alguien con permiso de escritura, con una
          #    línea `vista-previa: https://….vercel.app` (plan manual, por si los
          #    dos de arriba fallan a la vez).
          #
          # Toda URL que no venga del aviso de GitHub se acepta solo si su
          # /api/health dice que sirve EXACTAMENTE este commit: no se puede
          # aprobar un PR probando otro código.
          #
          # Hasta 30 minutos (180 × 10 s). Sin vista previa, falla.
          verificar_sha() {
            curl -fsS --max-time 15 -H "x-vercel-protection-bypass: $BYPASS" "${1%/}/api/health" 2>/dev/null | jq -r '.sha // empty'
          }

          clave_rechazada_avisada=""

          for i in $(seq 1 180); do
            # ── 1. Vercel directo ──────────────────────────────────────────────
            if [ -n "$VERCEL_TOKEN" ]; then
              RESP=$(curl -sS --max-time 15 -w '\n%{http_code}' \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&target=preview&limit=50" 2>/dev/null || true)
              CODE=$(printf '%s' "$RESP" | tail -n1)
              CUERPO=$(printf '%s' "$RESP" | sed '$d')
              if [ "$CODE" = "200" ]; then
                ESTADO=$(printf '%s' "$CUERPO" | jq -r --arg sha "$PR_SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha)] | .[0].readyState // empty' 2>/dev/null)
                URL_V=$(printf '%s' "$CUERPO" | jq -r --arg sha "$PR_SHA" '[.deployments[] | select(.meta.githubCommitSha == $sha)] | .[0].url // empty' 2>/dev/null)
                if [ "$ESTADO" = "READY" ] && [ -n "$URL_V" ]; then
                  SHA_V=$(verificar_sha "https://$URL_V")
                  if [ "$SHA_V" = "$PR_SHA" ]; then
                    echo "url=https://$URL_V" >> "$GITHUB_OUTPUT"
                    echo "Preview ready (Vercel directo, verificada por /api/health): https://$URL_V"
                    exit 0
                  fi
                  echo "Vercel directo: https://$URL_V está lista pero sirve '${SHA_V:-?}', no $PR_SHA — se sigue esperando"
                elif [ "$ESTADO" = "ERROR" ] || [ "$ESTADO" = "CANCELED" ]; then
                  echo "::error::Vercel no pudo armar la vista previa de este commit (estado $ESTADO). Mirá el build en Vercel: no hay nada que esperar."
                  exit 1
                elif [ -n "$ESTADO" ]; then
                  echo "Vercel directo: vista previa en $ESTADO ($i/180)"
                fi
              elif [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
                if [ -z "$clave_rechazada_avisada" ]; then
                  echo "::warning::Vercel rechazó la clave VERCEL_TOKEN (HTTP $CODE): venció o la revocaron. El control sigue por el aviso de GitHub, que puede tardar. Hay que crear una nueva y cargarla en los secretos del repo."
                  clave_rechazada_avisada=1
                fi
              fi
            fi

            # ── 2. El aviso de Vercel a GitHub ─────────────────────────────────
            # El repo tiene DOS proyectos Vercel conectados (el marketplace y la
            # instancia institucional), así que Vercel desambigua los entornos:
            # ya no existe "Preview" a secas, sino "Preview - uber-doc" y
            # "Preview - instancia-institucional". Buscamos el del marketplace,
            # que es contra el que corren estos tests; el de la instancia se
            # cancela por Ignored Build Step y nunca tiene environment_url.
            DEPLOY_ID=$(gh api "repos/$GH_REPO/deployments?sha=$PR_SHA" \
              --jq '[.[] | select(.environment | startswith("Preview")) | select(.environment | test("instancia") | not)] | .[0].id // empty' 2>/dev/null)

            if [ -n "$DEPLOY_ID" ]; then
              STATUS=$(gh api "repos/$GH_REPO/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].state // empty' 2>/dev/null)
              URL=$(gh api "repos/$GH_REPO/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].environment_url // empty' 2>/dev/null)

              if [ "$STATUS" = "success" ] && [ -n "$URL" ]; then
                echo "url=$URL" >> "$GITHUB_OUTPUT"
                echo "Preview ready: $URL"
                exit 0
              fi
              echo "Deploy found (id=$DEPLOY_ID), status=$STATUS — waiting... ($i/180)"
            else
              echo "No deployment found yet — waiting... ($i/180)"
            fi

            # ── 3. Plan manual: el último comentario "vista-previa:" ───────────
            URL_B=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '[.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body | capture("vista-previa: *(?<u>https://[a-z0-9-]+-diegocartu-devs-projects\\.vercel\\.app)") | .u] | last // empty' 2>/dev/null)
            if [ -n "$URL_B" ]; then
              SHA_B=$(verificar_sha "$URL_B")
              if [ "$SHA_B" = "$PR_SHA" ]; then
                echo "url=$URL_B" >> "$GITHUB_OUTPUT"
                echo "Preview ready (plan B, verificada por /api/health): $URL_B"
                exit 0
              fi
              echo "Plan B: $URL_B sirve '${SHA_B:-?}', no $PR_SHA — se ignora"
            fi

            sleep 10
          done

          echo "::error::Timeout waiting for Vercel preview deployment (30 min)"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Camino 1. Los dos ids no son secretos (Vercel los documenta así); la
          # clave sí, y sin ella este camino se saltea solo.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_Hl1HHLiy3G0Pj0TEE4ow6rsiZOe7
          VERCEL_TEAM_ID: team_HVhngjNbDhN22ZFXl8ldRAgu

      - name: Set test URL
        id: test-url
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PREVIEW_URL" ]; then
            if [[ ! "$PREVIEW_URL" =~ ^https://.*\.vercel\.app/?$ ]]; then
              echo "::error::Preview URL does not match expected Vercel domain: $PREVIEW_URL"
              exit 1
            fi
            echo "base_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            echo "Testing against preview: $PREVIEW_URL"
          else
            echo "base_url=$FALLBACK_URL" >> "$GITHUB_OUTPUT"
            echo "Testing against production: $FALLBACK_URL"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          FALLBACK_URL: ${{ env.PLAYWRIGHT_BASE_URL }}

      - name: Reset cuentas de prueba
        run: node scripts/sereno-reset.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.test-url.outputs.base_url }}
          # Bypass de Vercel Deployment Protection: deja al CI entrar al preview
          # protegido (era lo que le faltaba a #65 → daba 401 → se revirtió).
          # La cabecera se manda solo si hay secret (ver playwright.config.ts).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Cleanup datos de prueba
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/sereno-cleanup.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Reportar resultado a /admin/sereno
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/sereno-report.mjs
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          SERENO_API_TOKEN: ${{ secrets.SERENO_API_TOKEN }}
