name: Quality Gate — Playwright

on:
  pull_request:
    branches: [main]
  schedule:
    # 3AM Argentina (UTC-3) = 6AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://uber-doc.vercel.app' }}

jobs:
  test:
    name: Etapa 1 — Tests críticos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - name: Reset cuentas de prueba
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/sereno-reset.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Cleanup datos de prueba
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/sereno-cleanup.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Reportar resultado a /admin/sereno
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/sereno-report.mjs
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          SERENO_API_TOKEN: ${{ secrets.SERENO_API_TOKEN }}
