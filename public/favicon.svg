        stroke="#6BB3E8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Tubo central hacia campana -->
  <line x1="16" y1="20" x2="16" y2="24"
        stroke="#6BB3E8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Auricular izquierdo -->
  <circle cx="10" cy="5" r="2.4" fill="#378ADD"/>
  <!-- Auricular derecho -->
  <circle cx="22" cy="5" r="2.4" fill="#378ADD"/>
  <!-- Campana -->
